; PlatformIO project configuration for the OTA Valve Master.

[platformio]
src_dir = src
include_dir = include
lib_dir = lib

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17

; Add this crucial line to force deep dependency checking:
lib_ldf_mode = deep+

monitor_speed = 115200


lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    